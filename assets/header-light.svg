<text x="788" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="600" fill="#1f2328">Angular</text>
