<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Willames Yano, fullstack developer">
<title>Willames Yano, fullstack developer</title>
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.4" fill="#d0d7de"/>
  </pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.45" stop-color="#fff" stop-opacity="1"/>
  </linearGradient>
  <mask id="fadeMask"><rect x="560" y="1" width="639" height="318" fill="url(#fade)"/></mask>
  <clipPath id="cardClip"><rect x="1" y="1" width="1198" height="318" rx="16"/></clipPath>
</defs>
<style>
  .flow { stroke-dasharray: 4 6; }
  @media (prefers-reduced-motion: no-preference) {
    .flow { animation: flow 1.6s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
  }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
</style>
<rect x="1" y="1" width="1198" height="318" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<g clip-path="url(#cardClip)">
  <rect x="560" y="1" width="639" height="318" fill="url(#dots)" mask="url(#fadeMask)"/>
</g>
<circle class="pulse" cx="70" cy="91" r="5" fill="#0e75b6"/>
<text x="88" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="3" fill="#0e75b6">FULLSTACK DEVELOPER</text>
<text x="64" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#1f2328">Willames Yano</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="23" fill="#59636e">
  <tspan x="66" y="224">I build web applications end to end:</tspan>
  <tspan x="66" y="256">interface, services, data and infrastructure.</tspan>
</text>
<g stroke="#0e75b6" stroke-width="2" fill="none">
  <path class="flow" d="M854 94 V132"/>
  <path class="flow" d="M854 188 V226"/>
  <path class="flow" d="M952 160.0 H980"/>
</g>
